<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Magnetic Field Simulator</title>
<style>
:root{--bg:#f6f5f1;--panel:#fff;--ink:#1c1c1a;--mut:#6b6b66;--line:#d9d7cf;--acc:#2a5bd7;--accink:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#101216;--panel:#1a1d23;--ink:#eceae4;--mut:#9a9a94;--line:#2c3038;--acc:#6f95ff;--accink:#0b1020;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#101216;--panel:#1a1d23;--ink:#eceae4;--mut:#9a9a94;--line:#2c3038;--acc:#6f95ff;--accink:#0b1020;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column}
.bar{display:flex;flex-wrap:wrap;gap:8px 14px;padding:10px 12px;background:var(--panel);border-bottom:1px solid var(--line);align-items:center}
.grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin-right:2px}
button,input[type=number]{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 10px}
button{cursor:pointer}
input[type=number]{width:62px;padding:5px 6px}
button:hover:not(:disabled){border-color:var(--acc)}
button.on{background:var(--acc);color:var(--accink);border-color:var(--acc)}
button:disabled{opacity:.4;cursor:not-allowed}
input[type=range]{width:110px;accent-color:var(--acc)}
label{display:flex;align-items:center;gap:6px;color:var(--mut)}
#wrap{flex:1;min-height:0;position:relative;background:#080b12}
canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
#ed{position:absolute;inset:0;display:none;flex-direction:column;background:#0b0f17;z-index:5}
#ed.open{display:flex}
#ecw{flex:1;min-height:0;position:relative}
#ed .bar{flex:none}
#ec{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:crosshair}
#dimdel{position:absolute;display:none;padding:3px 8px;font-size:12px;border-color:#ffcf5a;background:#1b2230;color:#ffcf5a}
#hint{position:absolute;left:10px;bottom:8px;color:#ffcf5a;font:12px system-ui,sans-serif;pointer-events:none}
#dimin{position:absolute;display:none;width:84px;padding:3px 6px;border:1px solid #ffcf5a;border-radius:4px;background:#1b2230;color:#ffcf5a;font:12px ui-monospace,Menlo,Consolas,monospace}
#cur{position:absolute;right:10px;top:8px;color:rgba(255,255,255,.6);font:12px ui-monospace,Menlo,Consolas,monospace;pointer-events:none}
</style></head><body>
<div class="bar">
 <div class="grp"><span class="lbl">Add</span>
  <button data-tool="N" class="on">North pole</button>
  <button data-tool="S">South pole</button>
  <button data-tool="bar">Bar magnet</button>
  <button data-tool="custom" title="Sketch a shape, then pick its north and south faces">Custom magnet</button>
  <button data-tool="dim" title="Pick a reference element, then the element to position">Dimension</button>
  <button data-tool="select">Select / move</button></div>
 <div class="grp"><span class="lbl">Position</span>
  <label>x <input type="number" id="px" min="0" max="100" step="0.5" value="50"></label>
  <label>y <input type="number" id="py" min="0" max="100" step="0.5" value="50"></label>
  <button id="addb" title="Place a new magnet of the chosen type at x, y">Add at x, y</button>
  <button id="movb" title="Move the selected magnet to x, y">Move to x, y</button></div>
 <div class="grp"><span class="lbl">Edit</span>
  <button id="undob" title="Undo (Ctrl+Z)">↶ Undo</button><button id="redob" title="Redo (Ctrl+Y or Ctrl+Shift+Z)">↷ Redo</button>
  <button id="ccw" title="Rotate counter-clockwise 15° (Q)">⟲ 15°</button>
  <button id="cw" title="Rotate clockwise 15° (E)">⟳ 15°</button>
  <button id="flip">Flip N/S</button>
  <input type="range" id="ang" min="0" max="359" value="0" title="Angle (degrees, counter-clockwise from +x)">
  <button id="del" title="Delete">Remove</button>
  <button id="clr">Clear all</button></div>
 <div class="grp"><span class="lbl">View</span>
  <label>Lines <input type="range" id="dens" min="6" max="40" value="18"></label>
  <label>Grid <input type="range" id="gs" min="100" max="1000" step="50" value="100"> <span id="gsv" style="min-width:78px">100 × 100</span></label>
  <label><input type="checkbox" id="arr" checked> Arrows</label>
  <button id="rv" title="Reset zoom and pan">Reset view</button>
  <button id="mus" title="Soothing background music">♪ Music</button><input type="range" id="vol" min="0" max="100" value="50" title="Music volume"></div>
</div>
<div id="wrap"><canvas id="c"></canvas><div id="cur">x: –  y: –</div><div id="hint"></div><input id="dimin" type="number" step="any"><button id="dimdel" title="Delete this dimension">Delete</button>
<div id="ed"><div class="bar">
 <div class="grp"><span class="lbl">Sketch</span><button data-st="path" class="on">Line</button><button data-st="curve">Curve</button><button data-st="rect">Rectangle</button><button data-st="ellipse">Ellipse</button></div>
 <div class="grp"><button id="edclose">Close shape</button><button id="edundo">Undo</button><button id="edclear">Clear</button></div>
 <div class="grp"><span class="lbl">Poles</span><button id="edN">Pick north face</button><button id="edS">Pick south face</button></div>
 <div class="grp"><button id="eddone" class="on">Use in main grid</button><button id="edcancel">Cancel</button></div>
 <span id="edmsg" style="color:#ffcf5a;font-size:12px"></span></div>
<div id="ecw"><canvas id="ec"></canvas></div></div></div>
<script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d'),$=id=>document.getElementById(id);
const R=12,LENU=20,M=34;           // pole radius (px), bar length (units), margin for labels (px)
let W=0,H=0,u=1,ox=0,oy=0,side=0,LEN=0,items=[],sel=null,tool='N',drag=null,lines=[],dirty=true;
let SZ=100,dims=[],dimSt={a:null,b:null},curPx=[0,0],editing=null;
let bgc=null,stars=[],flies=[];const rotatable=i=>i&&(i.t==='bar'||i.t==='custom');
let fx=0,fy=0,undoS=[],redoS=[],last={items:[],dims:[],sel:-1},dragMoved=false,au=null,musicOn=false;
let zm=1,panX=0,panY=0,side0=100,panMode=false,panDrag=null,lastAdd=null,tmpl=null,E={open:false,tool:'path'};
const X=x=>ox+x*u,Y=y=>oy+side-y*u,UX=p=>(p-ox)/u,UY=p=>(oy+side-p)/u;
const clamp=v=>Math.max(0,Math.min(SZ,v)),r1=v=>Math.round(v*10)/10;

function resize(){const r=cv.parentElement.getBoundingClientRect(),d=window.devicePixelRatio||1;
 W=r.width;H=r.height;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);
 side0=Math.max(100,Math.min(W,H)-2*M);layoutGrid();buildBG(d);draw();}
function poles(){const P=[];for(const it of items){const cx=X(it.x),cy=Y(it.y);
 if(it.t==='bar'){const dx=Math.cos(it.a)*LEN/2,dy=-Math.sin(it.a)*LEN/2;
  P.push({x:cx+dx,y:cy+dy,q:1},{x:cx-dx,y:cy-dy,q:-1});}
 else if(it.t==='custom')facePoles(it,P);
 else P.push({x:cx,y:cy,q:it.t==='N'?1:-1});}return P;}
function field(P,x,y){let bx=0,by=0;for(const p of P){const dx=x-p.x,dy=y-p.y,r2=dx*dx+dy*dy+4,r3=r2*Math.sqrt(r2);
 bx+=p.q*dx/r3;by+=p.q*dy/r3;}return[bx,by];}
function trace(P,x,y,s){const pts=[[x,y]];
 for(let i=0;i<1800;i++){const h=3;let[bx,by]=field(P,x,y),m=Math.hypot(bx,by);if(m<1e-12)break;
  let[cx,cy]=field(P,x+s*bx/m*h/2,y+s*by/m*h/2),m2=Math.hypot(cx,cy)||1;
  x+=s*cx/m2*h;y+=s*cy/m2*h;pts.push([x,y]);
  for(const p of P)if(p.q*s<0&&Math.hypot(x-p.x,y-p.y)<7)return{pts,hit:true};
  if(x<ox||y<oy||x>ox+side||y>oy+side)break;}
 return{pts,hit:false};}
function arrow(x,y,ang,sz){ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.beginPath();
 ctx.moveTo(sz,0);ctx.lineTo(-sz*.7,sz*.6);ctx.lineTo(-sz*.7,-sz*.6);ctx.closePath();ctx.fill();ctx.restore();}

function draw(){dirty=true;syncUI();}
function build(){
 lines=[];const P=poles(),n=+$('dens').value;
 for(const p of P){const s=p.q>0?1:-1;
  const kk=p.k||n;for(let k=0;k<kk;k++){const th=(k+.5)/kk*Math.PI*2;
   const r=trace(P,p.x+Math.cos(th)*8,p.y+Math.sin(th)*8,s);
   if(s<0&&r.hit)continue; // already drawn from the north pole
   lines.push({pts:r.pts,s,len:(r.pts.length-1)*3});}}
}
function render(t){
 ctx.clearRect(0,0,W,H);
 if(dirty){dirty=false;build();}
 drawScene(t);
 // fixed grid frame: nothing is ever drawn outside it
 ctx.fillStyle='#141923';ctx.fillRect(fx,fy,side0,side0);
 ctx.save();ctx.beginPath();ctx.rect(fx,fy,side0,side0);ctx.clip();
 ctx.lineWidth=1;
 const stp=[1,2,5,10,20,50,100,200,500].find(s=>s*u>=46)||500;
 for(let v=0;v<=SZ;v+=stp){
  ctx.strokeStyle=v%(stp*5)?'rgba(255,255,255,.07)':'rgba(255,255,255,.17)';
  ctx.beginPath();ctx.moveTo(X(v),oy);ctx.lineTo(X(v),oy+side);ctx.moveTo(ox,Y(v));ctx.lineTo(ox+side,Y(v));ctx.stroke();}
 if(!items.length){ctx.fillStyle='rgba(255,255,255,.55)';ctx.font='15px system-ui,sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText('Pick a magnet type, then click the grid or enter x, y',fx+side0/2,fy+side0/2);}
 ctx.lineWidth=1.2;ctx.strokeStyle='rgba(150,200,255,.75)';ctx.fillStyle='rgba(190,225,255,.95)';
 const sp=70,off=((t||0)*0.045)%sp,show=$('arr').checked;
 for(const L of lines){const pts=L.pts;ctx.beginPath();ctx.moveTo(pts[0][0],pts[0][1]);
  for(let i=1;i<pts.length;i++)ctx.lineTo(pts[i][0],pts[i][1]);ctx.stroke();
  if(show&&pts.length>2)for(let d=off;d<L.len;d+=sp){const q=L.s>0?d:L.len-d;
   const i=Math.min(pts.length-1,Math.max(1,Math.round(q/3)));
   const a=Math.atan2(pts[i][1]-pts[i-1][1],pts[i][0]-pts[i-1][0])+(L.s<0?Math.PI:0);
   arrow(pts[i][0],pts[i][1],a,4);}}
 // magnets
 for(const it of items){const cx=X(it.x),cy=Y(it.y);
  if(it.t==='bar'){ctx.save();ctx.translate(cx,cy);ctx.rotate(-it.a);
   ctx.fillStyle='#2467d6';ctx.fillRect(-LEN/2,-13,LEN/2,26);
   ctx.fillStyle='#d6372c';ctx.fillRect(0,-13,LEN/2,26);
   ctx.fillStyle='#fff';ctx.font='bold 14px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillText('S',-LEN/4,1);ctx.fillText('N',LEN/4,1);
   if(it===sel){ctx.strokeStyle='#fff';ctx.setLineDash([4,3]);ctx.lineWidth=1.5;ctx.strokeRect(-LEN/2-4,-17,LEN+8,34);}
   ctx.restore();}
  else if(it.t==='custom')drawCustom(it);
  else{ctx.beginPath();ctx.arc(cx,cy,R,0,7);ctx.fillStyle=it.t==='N'?'#d6372c':'#2467d6';ctx.fill();
   ctx.fillStyle='#fff';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillText(it.t,cx,cy+1);
   if(it===sel){ctx.beginPath();ctx.arc(cx,cy,R+5,0,7);ctx.strokeStyle='#fff';ctx.setLineDash([4,3]);ctx.lineWidth=1.5;ctx.stroke();}}
  ctx.setLineDash([]);}
 drawDims();
 ctx.restore();
 ctx.shadowColor='rgba(150,185,255,.45)';ctx.shadowBlur=16;ctx.strokeStyle='rgba(200,215,255,.45)';ctx.lineWidth=1;ctx.strokeRect(fx,fy,side0,side0);ctx.shadowBlur=0;
 ctx.font='11px system-ui,sans-serif';ctx.fillStyle='rgba(255,255,255,.5)';
 for(let v=0;v<=SZ;v+=stp){const x=X(v),y=Y(v);
  if(x>=fx-1&&x<=fx+side0+1){ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText(v,x,fy+side0+6);}
  if(y>=fy-1&&y<=fy+side0+1){ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillText(v,fx-6,y);}}
 ctx.textAlign='center';ctx.textBaseline='top';ctx.fillText('x →',fx+side0/2,fy+side0+20);
 ctx.textAlign='left';ctx.textBaseline='bottom';ctx.fillText('y ↑',fx,fy-6);
}
function loop(t){if(E.open)edRender(t);else render(t);requestAnimationFrame(loop);}

/* ---- locked dimensions ---- */
function mkDim(A,B,t,o){const v=t==='h'?Math.abs(B.x-A.x):t==='v'?Math.abs(B.y-A.y):Math.hypot(B.x-A.x,B.y-A.y);
 return{a:A,b:B,type:t,o,v,sx:B.x>=A.x?1:-1,sy:B.y>=A.y?1:-1};}
function solve(D){for(let k=0;k<8;k++){for(const d of dims){let O,f;
  if(d.a===D){O=d.b;f=-1;}else if(d.b===D){O=d.a;f=1;}else continue;
  if(d.type==='h')D.x=O.x+f*d.sx*d.v;
  else if(d.type==='v')D.y=O.y+f*d.sy*d.v;
  else{let dx=D.x-O.x,dy=D.y-O.y,L=Math.hypot(dx,dy);if(L<1e-9){dx=1;dy=0;L=1;}D.x=O.x+dx/L*d.v;D.y=O.y+dy/L*d.v;}}}
 D.x=clamp(D.x);D.y=clamp(D.y);}

/* ---- custom magnets ---- */
/* ---- night forest line-art backdrop (outlines only) ---- */
function rng(s){return()=>(s=(s*1664525+1013904223)>>>0)/4294967296;}
function drawScene(t){if(bgc)ctx.drawImage(bgc,0,0,W,H);t=t||0;ctx.lineWidth=1;
 for(const s of stars){ctx.strokeStyle='rgba(220,232,255,'+(.3+.35*Math.sin(t*.0017+s.p)).toFixed(2)+')';
  ctx.beginPath();ctx.moveTo(s.x-s.s,s.y);ctx.lineTo(s.x+s.s,s.y);ctx.moveTo(s.x,s.y-s.s);ctx.lineTo(s.x,s.y+s.s);ctx.stroke();}
 for(const f of flies){const a=(.25+.75*Math.max(0,Math.sin(t*.0012*f.f+f.p))).toFixed(2),x=f.x+Math.sin(t*.0003*f.f+f.p)*34,y=f.y+Math.cos(t*.00041*f.f+f.p)*20;
  ctx.shadowColor='rgba(215,255,130,'+a+')';ctx.shadowBlur=12;ctx.strokeStyle='rgba(225,255,150,'+a+')';
  ctx.beginPath();ctx.arc(x,y,2,0,7);ctx.stroke();ctx.strokeStyle='rgba(225,255,150,'+a*.35+')';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.stroke();}
 ctx.shadowBlur=0;}


/* ---- undo / redo ---- */
function capture(){const ix=new Map(items.map((it,i)=>[it,i]));
 return{items:items.map(it=>JSON.parse(JSON.stringify(it))),dims:dims.map(d=>({a:ix.get(d.a),b:ix.get(d.b),type:d.type,o:d.o,v:d.v,sx:d.sx,sy:d.sy})),sel:ix.has(sel)?ix.get(sel):-1};}
function restore(st){items=st.items.map(o=>JSON.parse(JSON.stringify(o)));dims=st.dims.map(d=>Object.assign({},d,{a:items[d.a],b:items[d.b]}));
 sel=st.sel>=0?items[st.sel]:null;dimSt={a:null,b:null};hideEdit();draw();}
function mark(){undoS.push(last);if(undoS.length>200)undoS.shift();redoS=[];last=capture();syncUI();}
function undo(){if(!undoS.length)return;redoS.push(capture());restore(undoS.pop());last=capture();}
function redo(){if(!redoS.length)return;undoS.push(capture());restore(redoS.pop());last=capture();}
$('undob').onclick=undo;$('redob').onclick=redo;$('ang').onchange=()=>mark();
addEventListener('keydown',e=>{if(E.open)return;const t=e.target;if(t&&t.tagName==='INPUT'&&t.type!=='range'&&t.type!=='checkbox')return;
 if(!(e.ctrlKey||e.metaKey))return;const k=e.key.toLowerCase();
 if(k==='z'&&!e.shiftKey){e.preventDefault();undo();}else if(k==='y'||(k==='z'&&e.shiftKey)){e.preventDefault();redo();}});
$('dimdel').addEventListener('mousedown',e=>e.preventDefault());
$('dimdel').onclick=()=>{const d=editing;if(!d)return;dims=dims.filter(x=>x!==d);hideEdit();draw();mark();};

/* ---- soothing ambient music (Web Audio, generated live, no files) ---- */
const CH=[[110,220,261.63,329.63,392],[87.31,174.61,261.63,349.23,440],[65.41,130.81,261.63,329.63,392],[98,196,246.94,293.66,392]],
 PN=[440,523.25,587.33,659.25,783.99,880,1046.5];let ci=0,cT=0,bT=0;
function musicInit(){const c=new(window.AudioContext||window.webkitAudioContext)(),m=c.createGain(),lp=c.createBiquadFilter(),
  dl=c.createDelay(2),fb=c.createGain(),wet=c.createGain();
 m.gain.value=0;lp.type='lowpass';lp.frequency.value=1500;dl.delayTime.value=.6;fb.gain.value=.42;wet.gain.value=.55;
 lp.connect(m);lp.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(m);m.connect(c.destination);au={c,m,lp};}
function chord(){const c=au.c,t=c.currentTime,ch=CH[ci++%CH.length];
 ch.forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain(),a=i<2?.07:.035;o.type=i<2?'sine':'triangle';o.frequency.value=f;o.detune.value=(Math.random()-.5)*8;
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(a,t+3);g.gain.linearRampToValueAtTime(a,t+8);g.gain.linearRampToValueAtTime(0,t+12);
  o.connect(g);g.connect(au.lp);o.start(t);o.stop(t+12.2);});
 cT=setTimeout(()=>{if(musicOn)chord();},9000);}
function bell(){const c=au.c,t=c.currentTime,o=c.createOscillator(),g=c.createGain();
 o.type='sine';o.frequency.value=PN[Math.floor(Math.random()*PN.length)];
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.07,t+.03);g.gain.exponentialRampToValueAtTime(.0005,t+4);
 o.connect(g);g.connect(au.lp);o.start(t);o.stop(t+4.2);
 bT=setTimeout(()=>{if(musicOn)bell();},1800+Math.random()*3200);}
function setMusic(on){musicOn=on;$('mus').classList.toggle('on',on);
 if(on){if(!au)musicInit();au.c.resume();au.m.gain.setTargetAtTime($('vol').value/100*.6,au.c.currentTime,1.2);clearTimeout(cT);clearTimeout(bT);chord();bell();}
 else if(au){au.m.gain.setTargetAtTime(0,au.c.currentTime,.6);clearTimeout(cT);clearTimeout(bT);}}
$('mus').onclick=()=>setMusic(!musicOn);
$('vol').oninput=()=>{if(au&&musicOn)au.m.gain.setTargetAtTime($('vol').value/100*.6,au.c.currentTime,.2);};

/* ---- view: zoom / pan ---- */
function layoutGrid(){side=side0*zm;u=side/SZ;fx=(W-side0)/2;fy=(H-side0)/2;
 panX=Math.min(0,Math.max(side0-side,panX));panY=Math.min(0,Math.max(side0-side,panY));
 ox=fx+panX;oy=fy+panY;LEN=Math.max(LENU*u,56);}
function setPan(v){panMode=v;panDrag=null;cv.style.cursor=v?'grab':(tool==='select'?'default':'crosshair');draw();}
$('rv').onclick=()=>{zm=1;panX=0;panY=0;layoutGrid();draw();};

/* ---- backdrop: stars + fireflies only ---- */
function buildBG(d){const r=rng(11);bgc=null;
 const out=(x,y)=>x<fx||x>fx+side0||y<fy||y>fy+side0;
 const pick=ym=>{let x,y,k=0;do{x=r()*W;y=r()*H*ym;}while(!out(x,y)&&++k<12);return[x,y];};
 stars=[];for(let i=0;i<150;i++){const p=pick(.9);stars.push({x:p[0],y:p[1],s:.8+r()*1.8,p:r()*6.28});}
 flies=[];for(let i=0;i<24;i++){const p=pick(1);flies.push({x:p[0],y:p[1],f:.6+r()*1.2,p:r()*6.28});}}

/* ---- custom magnets (curved outlines, face poles) ---- */
function newCustom(x,y){return{t:'custom',x,y,a:0,pts:tmpl.pts,fn:tmpl.fn,fs:tmpl.fs,ext:tmpl.ext};}
function cs(it){return Math.max(1,56/((it.ext||1)*u));}
function toW(it,l){const c=Math.cos(it.a),s=Math.sin(it.a),k=cs(it);return[X(it.x+k*(l[0]*c-l[1]*s)),Y(it.y+k*(l[0]*s+l[1]*c))];}
function plen(p){let L=0;for(let i=1;i<p.length;i++)L+=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);return L;}
function along(p,f){const t=f*plen(p);let L=0;for(let i=1;i<p.length;i++){const d=Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]);
 if(L+d>=t||i===p.length-1){const k=d?(t-L)/d:0;return[p[i-1][0]+(p[i][0]-p[i-1][0])*k,p[i-1][1]+(p[i][1]-p[i-1][1])*k];}L+=d;}return p[0];}

 if(sel&&!(ae&&ae.type==='number')){$('px').value=r1(sel.x);$('py').value=r1(sel.y);}}

function hit(px,py){for(let i=items.length-1;i>=0;i--){const it=items[i],dx=px-X(it.x),dy=py-Y(it.y);
 if(it.t==='bar'){const c=Math.cos(it.a),s=Math.sin(it.a),lx=dx*c-dy*s,ly=dx*s+dy*c;
  if(Math.abs(lx)<LEN/2+4&&Math.abs(ly)<17)return it;}
 else if(it.t==='custom'){if(inPoly(it,px,py))return it;}
 else if(Math.hypot(dx,dy)<R+4)return it;}return null;}
function pos(e){const r=cv.getBoundingClientRect();return[e.clientX-r.left,e.clientY-r.top];}
const inside=(px,py)=>px>=fx&&px<=fx+side0&&py>=fy&&py<=fy+side0;

cv.addEventListener('pointerdown',e=>{if(e.button!==0)return;const[px,py]=pos(e);if(!inside(px,py))return;const h=hit(px,py);
 if(panMode){panDrag={x:px,y:py,ax:panX,ay:panY};cv.setPointerCapture(e.pointerId);cv.style.cursor='grabbing';return;}
 if(tool==='dim'){dimClick(px,py,h);return;}
 if(!h&&hitDim(px,py))return;
 if(h){sel=h;drag={dx:h.x-UX(px),dy:h.y-UY(py)};cv.setPointerCapture(e.pointerId);}
 else if(tool!=='select'&&inside(px,py)){if(tool==='custom'&&!tmpl)return;const it=tool==='custom'?newCustom(r1(UX(px)),r1(UY(py))):{t:tool,x:r1(UX(px)),y:r1(UY(py)),a:0};items.push(it);sel=it;lastAdd={it,ts:Date.now()};mark();}
 else sel=null;draw();});
cv.addEventListener('pointermove',e=>{const[px,py]=pos(e);curPx=[px,py];
 if(panDrag){panX=panDrag.ax+px-panDrag.x;panY=panDrag.ay+py-panDrag.y;layoutGrid();draw();return;}
 $('cur').textContent=inside(px,py)?'x: '+UX(px).toFixed(1)+'  y: '+UY(py).toFixed(1):'x: –  y: –';
 if(!drag||!sel)return;dragMoved=true;sel.x=clamp(UX(px)+drag.dx);sel.y=clamp(UY(py)+drag.dy);solve(sel);draw();});
cv.addEventListener('pointerup',()=>{if(drag&&dragMoved)mark();drag=null;dragMoved=false;if(panDrag){panDrag=null;cv.style.cursor='grab';}});
cv.addEventListener('pointerleave',()=>$('cur').textContent='x: –  y: –');
cv.addEventListener('wheel',e=>{const[px,py]=pos(e);if(!inside(px,py))return;e.preventDefault();
 if(e.shiftKey){if(rotatable(sel))rot(-Math.sign(e.deltaY||e.deltaX)*5);return;}
 const wx=UX(px),wy=UY(py);zm=Math.max(1,Math.min(8,zm*Math.exp(-e.deltaY*.0015)));
 side=side0*zm;u=side/SZ;panX=px-wx*u-fx;panY=py-side+wy*u-fy;layoutGrid();draw();},{passive:false});

function rot(deg){if(rotatable(sel)){sel.a+=deg*Math.PI/180;draw();mark();}}
function coords(){return[clamp(parseFloat($('px').value)||0),clamp(parseFloat($('py').value)||0)];}
$('addb').onclick=()=>{if(tool==='select'||tool==='dim'||(tool==='custom'&&!tmpl))return;const[x,y]=coords();const it=tool==='custom'?newCustom(x,y):{t:tool,x,y,a:0};items.push(it);sel=it;draw();mark();};
$('movb').onclick=()=>{if(!sel)return;[sel.x,sel.y]=coords();solve(sel);draw();mark();};
$('ccw').onclick=()=>rot(15);$('cw').onclick=()=>rot(-15);$('flip').onclick=()=>{if(sel&&sel.t==='custom'){[sel.fn,sel.fs]=[sel.fs,sel.fn];draw();mark();}else rot(180);};
$('ang').oninput=e=>{if(rotatable(sel)){sel.a=+e.target.value*Math.PI/180;draw();}};
$('del').onclick=()=>delItem(sel);
$('clr').onclick=()=>{items=[];dims=[];sel=null;draw();mark();};
$('dens').oninput=draw;
document.querySelectorAll('[data-tool]').forEach(b=>b.onclick=()=>{tool=b.dataset.tool;
 document.querySelectorAll('[data-tool]').forEach(x=>x.classList.toggle('on',x===b));
 cv.style.cursor=tool==='select'?'default':'crosshair';dimSt={a:null,b:null};hideEdit();panMode=false;panDrag=null;syncUI();if(tool==='custom')openEd();});
addEventListener('keydown',e=>{if(e.target.tagName==='INPUT'&&e.target.type!=='range'&&e.target.type!=='checkbox')return;if(E.open)return;
 if(e.key==='Delete'||e.key==='Backspace'){$('del').click();}
 else if(e.key==='q'||e.key==='Q')rot(15);else if(e.key==='e'||e.key==='E')rot(-15);});
addEventListener('resize',resize);resize();requestAnimationFrame(loop);
</script></body></html>
